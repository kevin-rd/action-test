name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      namespace_k8s:
        description: deploy environment tag, example. mechain-dev/mechain-test
        required: true
        type: string
      release_name:
        description: Deployment name in kubernetes.
        required: true
        type: string
      publish_tag:
        description: The tag of the image, example. develop,test,None.
        required: false
        type: string

jobs:
  deploy_to_k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Github version info
        id: meta
        run: |
          if [ -n ${{ inputs.publish_tag }} ]; then
            echo "version=${{ inputs.publish_tag }} (commit=`echo ${GITHUB_SHA} | cut -c1-8`)" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --always --tags --match='v*') (commit=`echo ${GITHUB_SHA} | cut -c1-8`)" >> "$GITHUB_OUTPUT"
          fi

      - name: Get commit logs
        id: commit_step
        run: |
          commit_logs=$(git log ${{ github.event.before }}..${{ github.sha }} --pretty=format:"%h - %s (%an)")
          echo "COMMIT_LOGS<<EOF" >> $GITHUB_ENV
          echo "$commit_logs" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      - name: "Notify message to Lark"
        run: echo "$COMMIT_LOGS"

