name: Build and Deploy Mechain

on:
  push:
    branches:
      - 'main'

jobs:
  diff_test:
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/get-diff-action@v6.1.2
        id: git_diff
        with:
          PATTERNS: |
            Dockerfile
            README.md

  publish_image:
    name: Publish Docker image
    if: env.GIT_DIFF
    uses: './.github/workflows/docker-publish.yml'
    secrets: inherit
    with:
      tags: kevin2025/action-test:develop

  deploy_with_k8s:
    name: Deploy with k8s
    uses: './.github/workflows/deploy-k8s.yml'
    secrets: inherit
    with:
      namespace_k8s: mechain-dev
      release_name: mechain-validator
      publish_tag: develop