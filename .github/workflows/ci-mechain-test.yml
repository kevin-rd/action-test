name: Build and Deploy Mechain

on:
  push:
    branches:
      - 'main'

jobs:
  publish_image:
    name: Publish Docker image
    if: false
    uses: '.github/workflows/docker-publish.yml'
    secrets: inherit
    with:
      tags: kevin2025/action-test:develop

  deploy_with_k8s:
    name: Deploy with k8s
    uses: '.github/workflows/deploy-k8s.yml'
    secrets: inherit
    with:
      namespace_k8s: mechain-dev
      release_name: mechain-validator
      publish_tag: develop